name: Compilar APK de Luisa Ludo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Dar permisos a gradlew si existe
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compilar APK con Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            echo "No se encontró gradlew en la raíz."
            exit 1
          fi

      - name: Subir APK compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: luisa-ludo-apk
          path: "**/build/outputs/apk/**/*.apk"
