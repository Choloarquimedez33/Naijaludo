name: Compilar APK de Luisa Ludo

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK FossReliant Debug
        run: ./gradlew assembleFossReliantDebug -x test -x jvmTest -x connectedAndroidTest -x dependencyGuard --offline || ./gradlew assembleFossReliantDebug -x test -x jvmTest -x connectedAndroidTest -x dependencyGuard

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: luisa-ludo-apk
          path: "**/build/outputs/apk/**/*.apk"
