name: Compilar APK de Luisa Ludo

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK con reintento si falla la red
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug -x test -x connectedAndroidTest --refresh-dependencies && exit 0
            echo "Intento $i falló, reintentando en 10 segundos..."
            sleep 10
          done
          exit 1

      - name: Subir APK compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: luisa-ludo-apk
          path: "**/build/outputs/apk/**/*.apk"
